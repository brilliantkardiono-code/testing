<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="css.css" rel="stylesheet">
  <script src="js.js"></script>
</head>
<body>
  <div class="thebox" style="gap:10px;">
    <div class="nav">

      <div class="money">
        balance
        <span>
          0
        </span>

      </div><!--money-->

      <div class="mutation">

        <div class="income">
          income
          <span>
            0
          </span>
        </div>

        <div class="expenses">
          expenses
          <span>
            0
          </span>
        </div>

      </div><!-- mutation-->

    </div>

    <div class="form">
      
      <div class="transaction">
        Transaction
        <div class="list">
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
          <button class="history">
            <span>item</span>
            <span>01</span>
          </button>
        </div>
      </div>

      <div class="input">
        Input
        <div class="isi">
          <form>
            <label for="name">Item name:</label>
            <input type="text">
            <label for="Value">Item value:</label>
            <input type="number">
            <button type="submit">Submit</button>
          </form>
        </div>
      </div>


    </div><!--form-->

  </div>
</body>
</html>
